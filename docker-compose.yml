services:
  ollama:
    image: ollama/ollama:latest
    container_name: mcp-ollama-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${DEFAULT_MODEL:-phi4-mini} && wait"]
    # Not in use any more (2026-11-21): kept but never started automatically. Start by hand with docker compose up -d.
    restart: "no"

volumes:
  ollama_data:
