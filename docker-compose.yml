services:
  ollama:
    image: ollama/ollama:latest
    container_name: mcp-ollama-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${DEFAULT_MODEL:-phi4-mini} && wait"]
    restart: unless-stopped

volumes:
  ollama_data:
